# P-256 ECDSA certificate, ECDHE-ECDSA suites only, TLS 1.2 and 1.3.
server {
    listen 443 ssl;
    server_name tls-ecdsa;

    ssl_certificate     /etc/nginx/tls/ec-p256-sha256-cert.pem;
    ssl_certificate_key /etc/nginx/tls/ec-p256-sha256-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    location / {
        return 200 "tls-ecdsa\n";
    }
}
