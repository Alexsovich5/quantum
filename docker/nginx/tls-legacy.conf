# RSA-2048 certificate with a SHA-1 signature, TLS 1.2 only, 3DES and static RSA suites.
server {
    listen 443 ssl;
    server_name tls-legacy;

    ssl_certificate     /etc/nginx/tls/rsa2048-sha1-cert.pem;
    ssl_certificate_key /etc/nginx/tls/rsa2048-sha1-key.pem;
    ssl_protocols       TLSv1.2;
    ssl_ciphers         DES-CBC3-SHA:AES128-SHA:@SECLEVEL=0;
    ssl_prefer_server_ciphers off;

    location / {
        return 200 "tls-legacy\n";
    }
}
