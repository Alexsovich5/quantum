# RSA-2048 certificate (SHA-256 signature), TLS 1.2 and 1.3; AES128-SHA uses static RSA key exchange.
server {
    listen 443 ssl;
    server_name tls-rsa;

    ssl_certificate     /etc/nginx/tls/rsa2048-sha256-cert.pem;
    ssl_certificate_key /etc/nginx/tls/rsa2048-sha256-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:AES128-SHA;
    ssl_prefer_server_ciphers off;
    # nginx ships no default DH parameters, so the DHE suite needs this file.
    ssl_dhparam         /etc/nginx/tls/dhparam-2048.pem;

    location / {
        return 200 "tls-rsa\n";
    }
}
